- switch:
  - name: PZP tepelne cerpadlo
    unique_id: pzp_heatpump_enable
    icon: mdi:heat-pump
    availability: '{{ is_state(''binary_sensor.pzp_zive_spojeni'',''on'') and states(''switch.pzp_pohotovost'')
      in [''on'',''off''] }}'
    state: '{{ is_state(''switch.pzp_pohotovost'', ''off'') }}'
    turn_on:
      action: switch.turn_off
      target:
        entity_id: switch.pzp_pohotovost
    turn_off:
      action: switch.turn_on
      target:
        entity_id: switch.pzp_pohotovost
- sensor:
  - name: PZP Okolí výparníku
    unique_id: pzp_ext_okoli_vyparniku
    state: '{% set v=states(''sensor.pzp_teploty_raw'').split('','') %}{{ ((v[2]|float * 0.1)|round(1)) if v|length>2
      and is_number(v[2]) else none }}'
    availability: '{{ has_value(''sensor.pzp_teploty_raw'') and states(''sensor.pzp_teploty_raw'').split('','')|length
      == 19 and is_state(''binary_sensor.pzp_bit_160_2'',''on'') }}'
    unit_of_measurement: °C
