- name: pzp_hp
  type: tcp
  host: !secret pzp_host
  port: 502
  timeout: 10
  delay: 0
  message_wait_milliseconds: 1000
  sensors:
  - name: PZP verze protokolu raw
    unique_id: pzp_protocol_raw
    slave: 1
    address: 0
    input_type: holding
    data_type: uint16
    scan_interval: 300
  - name: PZP vstupni voda
    unique_id: pzp_inlet_temperature
    slave: 1
    address: 100
    input_type: holding
    data_type: int16
    scan_interval: 60
    scale: 0.1
    precision: 1
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
  - name: PZP vystupni voda
    unique_id: pzp_outlet_temperature
    slave: 1
    address: 101
    input_type: holding
    data_type: int16
    scan_interval: 60
    scale: 0.1
    precision: 1
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
  - name: PZP teplota TUV
    unique_id: pzp_dhw_temperature
    slave: 1
    address: 105
    input_type: holding
    data_type: int16
    scan_interval: 60
    scale: 0.1
    precision: 1
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
  - name: PZP stav raw
    unique_id: pzp_state_raw
    slave: 1
    address: 5003
    input_type: holding
    data_type: uint16
    scan_interval: 60
  - name: PZP pokojova teplota
    unique_id: pzp_room_temperature_01
    slave: 1
    address: 109
    input_type: holding
    data_type: int16
    scale: 0.1
    precision: 1
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    scan_interval: 60
  - name: PZP identifikace raw
    unique_id: pzp_identifikace_raw
    slave: 1
    address: 0
    input_type: holding
    data_type: custom
    scan_interval: 300
    count: 12
    structure: '>12H'
    precision: 0
  - name: PZP teploty raw
    unique_id: pzp_teploty_raw
    slave: 1
    address: 100
    input_type: holding
    data_type: custom
    scan_interval: 120
    count: 19
    structure: '>19h'
    precision: 0
  - name: PZP regulace raw
    unique_id: pzp_regulace_raw
    slave: 1
    address: 130
    input_type: holding
    data_type: custom
    scan_interval: 120
    count: 23
    structure: '>23h'
    precision: 0
  - name: PZP krivky raw
    unique_id: pzp_krivky_raw
    slave: 1
    address: 5000
    input_type: holding
    data_type: custom
    scan_interval: 300
    count: 3
    structure: '>3h'
    precision: 0
  - name: PZP hodiny raw
    unique_id: pzp_hodiny_raw
    slave: 1
    address: 7
    input_type: holding
    data_type: uint16
    scan_interval: 60
  binary_sensors:
  - name: PZP pohotovostni rezim
    unique_id: pzp_standby_read
    slave: 1
    address: 2023
    input_type: coil
    scan_interval: 60
  - name: PZP bit 1
    unique_id: pzp_block_coil_1
    slave: 1
    address: 1
    input_type: coil
    scan_interval: 300
    slave_count: 20
  - name: PZP bit 30
