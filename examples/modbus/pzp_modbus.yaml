  switches:
  - name: PZP pohotovost
    unique_id: pzp_standby_control
    slave: 1
    address: 2023
    write_type: coil
    command_on: 1
    command_off: 0
    verify:
      address: 2023
      input_type: coil
      delay: 0
    scan_interval: 120
